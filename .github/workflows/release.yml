name: Release & Attest

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            script: npm run dist
          - os: macos-latest
            platform: macos
            script: npm run dist:mac
          - os: ubuntu-latest
            platform: linux
            script: npm run dist:linux

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Installer Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: ${{ matrix.script }}

      - name: Upload Platform Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.yml
          if-no-files-found: warn

  release:
    name: Release & Attestation
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-artifacts-*
          path: dist-merged
          merge-multiple: true

      - name: Stage Artifacts & Generate Unified Checksums
        run: |
          mkdir -p dist
          cp -r dist-merged/* dist/
          node scripts/generate-checksums.cjs --all
          ls -la dist/

      - name: Resolve Artifact Paths for Attestation
        id: resolve-artifacts
        run: |
          FILES=$(find dist -maxdepth 1 -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "SHA256SUMS.txt" \) | tr '\n' ',' | sed 's/,$//')
          echo "paths=$FILES" >> "$GITHUB_OUTPUT"

      - name: Generate Cryptographic SLSA Attestations
        uses: actions/attest-build-provenance@v2
        if: steps.resolve-artifacts.outputs.paths != ''
        with:
          subject-path: ${{ steps.resolve-artifacts.outputs.paths }}

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.yml
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
